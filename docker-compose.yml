services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_agri
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    environment:
      APP_PORT: 8000
      POSTGRES_URI: postgresql+psycopg2://postgres:postgres@postgres:5432/smart_agri
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: smart_agri
    depends_on:
      - postgres
      - mongo
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pg_data:
  mongo_data:
